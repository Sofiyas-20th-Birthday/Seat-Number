<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Find your seat at Sofia’s 20th birthday."
    />
    <title>Sofia’s 20th Birthday · Find your seat</title>
    <style>
      :root {
        --paper: #f7f6f2;
        --ink: #121310;
        --muted: #777970;
        --line: #dedfd9;
        --accent: #f05a3c;
        --accent-deep: #b93620;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body {
        width: 100%;
        max-width: 100%;
        min-height: 100svh;
        margin: 0;
        overflow-x: hidden;
        position: relative;
        color: var(--ink);
        background: var(--paper);
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .shell {
        width: 100%;
        max-width: 480px;
        min-width: 0;
        min-height: 100svh;
        margin: 0 auto;
        padding: 0 18px 22px;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        min-height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--line);
      }

      .event-name,
      .event-date {
        margin: 0;
      }

      .event-name {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.9rem;
        font-weight: 400;
        letter-spacing: -0.01em;
      }

      .birthday-trigger {
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 4px;
        outline: none;
        color: #b8891d;
        background: transparent;
        cursor: pointer;
        font: inherit;
        font-weight: 400;
      }

      .birthday-trigger:focus-visible {
        box-shadow: 0 0 0 3px rgba(184, 137, 29, 0.18);
      }

      .event-name::before {
        color: var(--accent);
        content: "✦";
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.78rem;
        animation: birthday-sparkle 2.4s ease-in-out infinite;
      }

      .event-name::after {
        position: absolute;
        top: -8px;
        right: -12px;
        color: #c89125;
        content: "✧";
        font-size: 0.67rem;
        animation: birthday-sparkle 2.4s 0.8s ease-in-out infinite;
      }

      .confetti-piece {
        position: fixed;
        top: var(--confetti-top);
        left: var(--confetti-left);
        z-index: 20;
        width: 6px;
        height: 9px;
        border-radius: 2px;
        opacity: 0;
        pointer-events: none;
        animation: confetti-drop 1.35s var(--confetti-delay) ease-out forwards;
      }

      .event-date {
        color: var(--muted);
        font-size: 0.67rem;
        font-weight: 640;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      main {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        flex: 1;
        display: block;
        padding: 36px 0 28px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent-deep);
        font-size: 0.67rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.35rem, 15.5vw, 4.5rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.92;
      }

      h1 em {
        color: var(--accent);
        font-weight: 400;
      }

      .intro {
        max-width: 330px;
        margin: 17px 0 0;
        color: var(--muted);
        font-size: 0.96rem;
        line-height: 1.5;
      }

      .finder {
        position: relative;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin-top: 28px;
      }

      .search-area {
        padding: 0 0 18px;
      }

      label {
        display: block;
        margin-bottom: 9px;
        color: var(--muted);
        font-size: 0.69rem;
        font-weight: 760;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .input-wrap {
        position: relative;
      }

      .search-symbol {
        position: absolute;
        top: 50%;
        left: 18px;
        width: 18px;
        height: 18px;
        border: 1.8px solid var(--ink);
        border-radius: 50%;
        transform: translateY(-58%);
        pointer-events: none;
      }

      .search-symbol::after {
        position: absolute;
        right: -5px;
        bottom: -3px;
        width: 7px;
        height: 1.8px;
        border-radius: 2px;
        background: var(--ink);
        content: "";
        transform: rotate(45deg);
        transform-origin: left;
      }

      input {
        width: 100%;
        height: 60px;
        padding: 0 48px 0 52px;
        border: 1px solid var(--line);
        border-radius: 15px;
        outline: none;
        color: var(--ink);
        background: var(--white);
        font: inherit;
        font-size: 16px;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      input::placeholder {
        color: #a4a49a;
      }

      input:focus {
        border-color: var(--ink);
        box-shadow: 0 0 0 3px rgba(18, 19, 16, 0.08);
      }

      .clear-button {
        position: absolute;
        top: 50%;
        right: 11px;
        width: 38px;
        height: 38px;
        padding: 0;
        display: none;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 1.35rem;
        line-height: 1;
        transform: translateY(-50%);
      }

      .clear-button:hover {
        color: var(--ink);
        background: rgba(29, 33, 28, 0.06);
      }

      .clear-button.visible {
        display: grid;
      }

      .results {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        min-height: 190px;
        padding: 0;
        border-top: 1px solid var(--line);
      }

      .prompt-state,
      .empty-state {
        min-height: 188px;
        padding: 24px 18px;
        display: grid;
        place-content: center;
        text-align: center;
      }

      .prompt-mark {
        display: none;
      }

      .state-title {
        margin: 0 0 7px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.28rem;
        font-weight: 400;
      }

      .state-copy {
        max-width: 260px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.55;
      }

      .match-list {
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0;
        list-style: none;
      }

      .match {
        width: 100%;
        min-height: 82px;
        padding: 13px 4px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        color: inherit;
        background: transparent;
        text-align: left;
        cursor: pointer;
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .match:hover,
      .match:focus-visible {
        outline: none;
        background: rgba(255, 255, 255, 0.55);
      }

      .match.best {
        background: transparent;
      }

      .match-name {
        display: block;
        overflow: hidden;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.18rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .match-name mark {
        color: var(--accent-deep);
        background: transparent;
      }

      .match-detail {
        margin-top: 5px;
        display: block;
        color: var(--muted);
        font-size: 0.76rem;
      }

      .flower-name {
        color: var(--flower-color, var(--ink));
        font-weight: 780;
      }

      .seat {
        min-width: 68px;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--white);
        color: var(--ink);
        text-align: center;
      }

      .seat small {
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 0.55rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .seat strong {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.2rem;
        font-weight: 400;
      }

      .confirmation {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        min-height: 280px;
        padding: 22px 0;
        display: grid;
        place-items: center;
        text-align: center;
        animation: appear 260ms ease both;
      }

      .confirmation > div {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      .confirmed-label {
        margin: 0 0 8px;
        color: var(--accent-deep);
        font-size: 0.67rem;
        font-weight: 780;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .confirmed-name {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.85rem;
        font-weight: 400;
        letter-spacing: -0.025em;
        overflow-wrap: anywhere;
      }

      .seat-number {
        margin: 12px 0 4px;
        color: var(--accent);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 4.8rem;
        font-weight: 400;
        letter-spacing: -0.065em;
        line-height: 0.95;
      }

      .seat-caption {
        margin: 0;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 760;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .map-wrap {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }

      .map-heading {
        margin: 0;
        font-size: 0.68rem;
        font-weight: 760;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .venue-map-viewport {
        position: relative;
        display: block;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        height: 360px;
        margin: 12px auto 0;
        overflow: scroll;
        contain: layout paint;
        border: 1px solid var(--line);
        border-radius: 20px;
        background:
          linear-gradient(rgba(18, 19, 16, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(18, 19, 16, 0.025) 1px, transparent 1px),
          rgba(255, 255, 255, 0.48);
        background-size: 32px 32px;
        cursor: grab;
        scrollbar-width: none;
        overscroll-behavior: contain;
        touch-action: pan-x pan-y;
        -webkit-overflow-scrolling: touch;
      }

      .venue-map-viewport::-webkit-scrollbar {
        display: none;
      }

      .venue-map {
        position: relative;
        width: 900px;
        min-width: 900px;
        max-width: none;
        height: 760px;
      }

      .venue-table {
        position: absolute;
        z-index: 1;
        width: var(--table-width, 104px);
        height: var(--table-height, 104px);
        display: grid;
        place-items: center;
        color: var(--muted);
        transform: translate(-50%, -50%);
        transition:
          width 220ms ease,
          height 220ms ease,
          color 220ms ease;
      }

      .venue-table.is-selected {
        z-index: 2;
        width: var(--focus-width, 230px);
        height: var(--focus-height, 230px);
        color: var(--ink);
      }

      .venue-table-core {
        position: absolute;
        inset: 12%;
        display: grid;
        place-content: center;
        border: 1px solid #c7c9c1;
        border-radius: 14px;
        background: rgba(247, 246, 242, 0.96);
        text-align: center;
      }

      .venue-table.round .venue-table-core {
        border-radius: 50%;
      }

      .venue-table.is-selected .venue-table-core {
        inset: 20%;
        border-color: var(--flower-color, var(--accent));
        background: var(--white);
        box-shadow: 0 18px 42px rgba(42, 39, 31, 0.1);
      }

      .venue-table.is-selected.rectangle .venue-table-core {
        inset: 7% 25%;
      }

      .venue-table-core span {
        max-width: 86px;
        overflow: hidden;
        color: var(--flower-color, var(--ink));
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.85rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .venue-table.is-selected .venue-table-core span {
        font-size: 1.05rem;
      }

      .venue-table-core small {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.5rem;
        font-weight: 740;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .map-seat {
        position: absolute;
        z-index: 3;
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        border: 1px solid #c7c9c1;
        border-radius: 50%;
        color: var(--muted);
        background: var(--paper);
        font-size: 0.48rem;
        font-weight: 760;
        transform: translate(-50%, -50%);
      }

      .venue-table.dense .map-seat {
        width: 16px;
        height: 16px;
        font-size: 0.42rem;
      }

      .map-seat.selected {
        width: 28px;
        height: 28px;
        border-color: var(--accent);
        color: var(--white);
        background: var(--accent);
        box-shadow: 0 0 0 6px rgba(240, 90, 60, 0.14);
        font-size: 0.63rem;
      }

      .map-you {
        position: absolute;
        z-index: 4;
        padding: 4px 7px;
        border-radius: 999px;
        color: var(--white);
        background: var(--ink);
        font-size: 0.53rem;
        font-weight: 760;
        letter-spacing: 0.07em;
        pointer-events: none;
        text-transform: uppercase;
        transform: translate(-50%, -38px);
      }

      .map-key {
        margin: 12px 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.73rem;
      }

      .map-key::before {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
      }

      .map-help {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.68rem;
      }

      .back-button {
        width: 100%;
        margin-top: 20px;
        min-height: 48px;
        padding: 11px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        background: transparent;
        cursor: pointer;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .back-button:hover {
        background: var(--white);
      }

      .shell.result-mode main {
        padding-top: 20px;
      }

      .shell.result-mode main > section:first-child,
      .shell.result-mode .search-area {
        display: none;
      }

      .shell.result-mode .finder {
        margin-top: 0;
      }

      .shell.result-mode .results {
        border-top: 0;
      }

      .shell.result-mode .confirmation {
        padding-top: 4px;
      }

      .shell.result-mode footer {
        display: none;
      }

      footer {
        padding-top: 15px;
        display: block;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.04em;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      @keyframes birthday-sparkle {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.8) rotate(-8deg);
        }
        50% {
          opacity: 1;
          transform: scale(1.12) rotate(8deg);
        }
      }

      @keyframes confetti-drop {
        0% {
          opacity: 0;
          transform: translate(0, -4px) rotate(0deg);
        }
        12% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform:
            translate(var(--confetti-drift), var(--confetti-fall))
            rotate(var(--confetti-spin));
        }
      }

      @media (max-width: 380px) {
        .shell {
          padding: 16px;
        }

        .topbar {
          gap: 10px;
        }

        .event-name {
          font-size: 0.76rem;
        }

        .event-date {
          font-size: 0.58rem;
        }

        main {
          padding-top: 36px;
        }

        h1 {
          font-size: 3.35rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <p class="event-name">
          Sofia’s
          <button
            class="birthday-trigger"
            type="button"
            aria-label="Celebrate Sofia’s 20th birthday"
          >20th</button>
          Birthday
        </p>
        <p class="event-date">4 August</p>
      </header>

      <main>
        <section aria-labelledby="page-title">
          <p class="eyebrow">Welcome</p>
          <h1 id="page-title">Find your <em>seat.</em></h1>
          <p class="intro">Type your name to see where you’re sitting.</p>
        </section>

        <section class="finder" aria-label="Guest seat finder">
          <div class="search-area">
            <label for="guest-search">Your name</label>
            <div class="input-wrap">
              <span class="search-symbol" aria-hidden="true"></span>
              <input
                id="guest-search"
                type="search"
                inputmode="search"
                placeholder="Start typing your name…"
                autocomplete="off"
                spellcheck="false"
                aria-controls="results"
              />
              <button class="clear-button" type="button" aria-label="Clear search">×</button>
            </div>
          </div>
          <div id="results" class="results" aria-live="polite"></div>
        </section>
      </main>

      <footer>
        <span>Need help? Ask a member of the welcome team.</span>
      </footer>
    </div>

      function celebrateBirthday() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        const colors = ["#b8891d", "#f05a3c", "#b94d73", "#76538f", "#4e7449"];
        const origin = birthdayTrigger.getBoundingClientRect();

        for (let index = 0; index < 14; index += 1) {
          const piece = document.createElement("span");
          piece.className = "confetti-piece";
          piece.style.background = colors[index % colors.length];
          piece.style.setProperty(
            "--confetti-left",
            `${origin.left + origin.width / 2 + (Math.random() * 14 - 7)}px`
          );
          piece.style.setProperty("--confetti-top", `${origin.bottom - 2}px`);
          piece.style.setProperty(
            "--confetti-drift",
            `${Math.round(Math.random() * 110 - 55)}px`
          );
          piece.style.setProperty(
            "--confetti-fall",
            `${Math.round(80 + Math.random() * 70)}px`
          );
          piece.style.setProperty(
            "--confetti-spin",
            `${Math.round(Math.random() * 540 - 270)}deg`
          );
          piece.style.setProperty(
            "--confetti-delay",
            `${(Math.random() * 0.16).toFixed(2)}s`
          );
          document.body.append(piece);
          window.setTimeout(() => piece.remove(), 1700);
        }
      }

      birthdayTrigger.addEventListener("click", celebrateBirthday);

      const normalize = (value) =>
        value
          .toLocaleLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim();

      function scoreName(name, query) {
        const target = normalize(name);
        const words = target.split(/\s+/);

        if (target === query) return 1000;
        if (target.startsWith(query)) return 800 - target.length;
        if (words.some((word) => word.startsWith(query))) return 650 - target.length;

        const index = target.indexOf(query);
        if (index !== -1) return 500 - index * 10 - target.length;

        let cursor = 0;
        for (const character of target) {
          if (character === query[cursor]) cursor += 1;
          if (cursor === query.length) return 250 - target.length;
        }

        return 0;
      }

      function safeHighlightedName(name, query) {
        const container = document.createElement("span");
        const normalizedName = normalize(name);
        const index = normalizedName.indexOf(query);

        if (index === -1) {
          container.textContent = name;
          return container.innerHTML;
        }

        container.append(document.createTextNode(name.slice(0, index)));
        const mark = document.createElement("mark");
        mark.textContent = name.slice(index, index + query.length);
        container.append(mark, document.createTextNode(name.slice(index + query.length)));
        return container.innerHTML;
      }

          </div>
        `;
      }

      function getTableColor(tableName) {
        return (
          venueTables.find((table) => table.name === tableName)?.flowerColor ||
          "#121310"
        );
      }

      function getSeatPosition(index, count, layout) {
        if (layout.shape === "round") {
          const angle = (90 - index * (360 / count)) * (Math.PI / 180);
          return {
            x: 50 + 42 * Math.cos(angle),
            y: 50 + 42 * Math.sin(angle)
          };
        }

        const firstSideSeats = layout.firstSideSeats;
        if (index < firstSideSeats) {
          const progress = firstSideSeats === 1 ? 0.5 : index / (firstSideSeats - 1);
          return { x: 76, y: 8 + progress * 84 };
        }

        const secondSideSeats = count - firstSideSeats;
        const secondIndex = index - firstSideSeats;
        const progress =
          secondSideSeats === 1 ? 0.5 : secondIndex / (secondSideSeats - 1);
        return { x: 24, y: 92 - progress * 84 };
      }

      function renderVenueTable(table, guest) {
        const isSelected = table.number === guest.tableNumber;
        const tableGuests = isSelected
          ? guests.filter((person) => person.tableNumber === table.number)
          : [];
        const layout = tableLayouts[guest.table];
        let markers = "";
        let youMarker = "";

        if (isSelected) {
          const selectedIndex = tableGuests.indexOf(guest);
          markers = tableGuests
            .map((person, index) => {
              const position = getSeatPosition(index, tableGuests.length, layout);
              const selected = index === selectedIndex ? " selected" : "";
              return `
                <span
                  class="map-seat${selected}"
                  style="left:${position.x}%; top:${position.y}%"
                  aria-hidden="true"
                >${person.seat}</span>
              `;
            })
            .join("");

          const selectedPosition = getSeatPosition(
            selectedIndex,
            tableGuests.length,
            layout
          );
          youMarker = `
            <span
              class="map-you"
              style="left:${selectedPosition.x}%; top:${selectedPosition.y}%"
              aria-hidden="true"
            >You</span>
          `;
        }

        return `
          <div
            class="venue-table ${table.shape} ${isSelected ? "is-selected" : ""} ${tableGuests.length > 20 ? "dense" : ""}"
            style="
              left:${table.x}px;
              top:${table.y}px;
              --table-width:${table.width}px;
              --table-height:${table.height}px;
              --focus-width:${table.focusWidth}px;
              --focus-height:${table.focusHeight}px;
              --flower-color:${table.flowerColor};
            "
          >
            <div class="venue-table-core">
              <span>${table.name}</span>
              <small>${table.subtitle || `Table ${table.number}`}</small>
            </div>
            ${markers}
            ${youMarker}
          </div>
        `;
      }

      function renderVenueMap(guest) {
        return `
          <div
            class="venue-map-viewport"
            role="img"
            aria-label="Venue map centered on ${guest.table}, table ${guest.tableNumber}. Seat ${guest.seat} is highlighted."
          >
            <div class="venue-map">
              ${venueTables.map((table) => renderVenueTable(table, guest)).join("")}
            </div>
          </div>
          <p class="map-key">Your seat is highlighted</p>
          <p class="map-help">Drag to explore the full venue</p>
        `;
      }

      function renderMapExperience(guest) {
        return `
          <div class="map-wrap">
            <p class="map-heading">Your exact position</p>
            ${renderVenueMap(guest)}
          </div>
        `;
      }

      function centerVenueMap(guest) {
        const viewport = results.querySelector(".venue-map-viewport");
        const table = venueTables.find(
          (venueTable) => venueTable.number === guest.tableNumber
        );
        if (!viewport || !table) return;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            viewport.scrollLeft = Math.max(
              0,
              table.x - viewport.clientWidth / 2
            );
            viewport.scrollTop = Math.max(
              0,
              table.y - viewport.clientHeight / 2
            );
            window.scrollTo(0, window.scrollY);
          });
        });
      }

      function selectGuest(guest) {
        shell.classList.add("result-mode");
        results.innerHTML = `
          <div class="confirmation">
            <div>
              <p class="confirmed-label">We found you</p>
              <h2 class="confirmed-name">${guest.name}</h2>
              <p class="seat-number">${guest.seat}</p>
              <p class="seat-caption">
                Seat ·
                <span
                  class="flower-name"
                  style="--flower-color:${getTableColor(guest.table)}"
                >${guest.table}</span>
                · Table ${guest.tableNumber}
              </p>
              ${renderMapExperience(guest)}
              <button class="back-button" type="button">Search another name</button>
            </div>
          </div>
        `;

        window.scrollTo(0, 0);
        centerVenueMap(guest);

        results.querySelector(".back-button").addEventListener("click", () => {
          shell.classList.remove("result-mode");
          input.value = "";
          clearButton.classList.remove("visible");
          showPrompt();
          window.scrollTo(0, 0);
          input.focus();
        });
      }

      function updateResults() {
        const query = normalize(input.value);
        clearButton.classList.toggle("visible", Boolean(input.value));

        if (!query) {
          showPrompt();
          return;
        }

        const matches = guests
          .map((guest, guestIndex) => ({
            guest,
            guestIndex,
            score: scoreName(guest.name, query)
          }))
          .filter((item) => item.score > 0)
          .sort((a, b) => b.score - a.score || a.guest.name.localeCompare(b.guest.name))
          .slice(0, 5);

        if (!matches.length) {
          showNoResults();
          return;
        }

        results.innerHTML = `
          <ul class="match-list" aria-label="Matching guests">
            ${matches
              .map(
                ({ guest, guestIndex }, index) => `
                  <li>
                    <button class="match ${index === 0 ? "best" : ""}" type="button" data-guest-index="${guestIndex}">
                      <span>
                        <span class="match-name">${safeHighlightedName(guest.name, query)}</span>
                        <span class="match-detail">
                          ${index === 0 ? "Best match" : "Possible match"} ·
                          <span
                            class="flower-name"
                            style="--flower-color:${getTableColor(guest.table)}"
                          >${guest.table}</span>
                          · Table ${guest.tableNumber}
                        </span>
                      </span>
                      <span class="seat">
                        <small>Seat</small>
                        <strong>${guest.seat}</strong>
                      </span>
                    </button>
                  </li>
                `
              )
              .join("")}
          </ul>
        `;

        results.querySelectorAll(".match").forEach((button) => {
          button.addEventListener("click", () => {
            const guest = guests[Number(button.dataset.guestIndex)];
            if (guest) selectGuest(guest);
          });
        });
      }

      input.addEventListener("input", updateResults);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          const bestMatch = results.querySelector(".match");
          if (bestMatch) bestMatch.click();
        }
      });

      clearButton.addEventListener("click", () => {
        input.value = "";
        updateResults();
        input.focus();
      });

      showPrompt();
